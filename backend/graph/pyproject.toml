[project]
name = "giga_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-docx>=1.2.0",
    "PyPDF2>=3.0.0",
    "striprtf>=0.0.26",
    # Библиотеки для чтения Excel файлов (XLS/XLSX)
    "openpyxl>=3.1.0",  # Для XLSX (Excel 2007+)
    "xlrd>=2.0.1",  # Для XLS (Excel 97-2003)
    "aiohttp>=3.12.15",
    "aiomysql>=0.2.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.116.1",
    "genson>=1.3.0",
    "greenlet>=3.2.3",
    "httpx>=0.28.1",
    "joblib>=1.5.1",
    "kaleido==0.2.0",
    # Обновлено для совместимости с langchain-core>=1.0.0 (требуется для langchain-deepseek>=1.0.1)
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    # langchain-gigachat отключен из-за конфликта с langchain-deepseek (требует langchain-core>=1.0.0)
    # "langchain-gigachat>=0.3.12",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=0.3.28",
    "langchain-tavily>=0.2.11",
    # Зависимости для векторного хранилища (lawyer_agent)
    # sentence-transformers удален - используется через embeddings-service
    # Локальные embeddings вынесены в отдельный контейнер для изоляции CUDA зависимостей
    "faiss-cpu>=1.7.4",
    "langgraph>=0.6.3",
    "langgraph-cli[inmem]>=0.3.6",
    "langgraph-sdk>=0.2.0",
    "markdownify>=1.1.0",
    "markdown>=3.7.0",
    "matplotlib>=3.10.5",
    "pillow>=11.3.0",
    "plotly>=6.2.0",
    "pydantic>=2.11.7",
    "pydantic-core>=2.33.2",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.1",
    "redis>=6.3.0",
    "requests>=2.32.4",
    "scikit-learn>=1.7.1",
    "sqlalchemy>=2.0.42",
    "sqlmodel>=0.0.24",
    "psycopg2-binary>=2.9.0",
    "typing-extensions>=4.14.1",
    "websockets>=15.0.1",
    "deepagents==0.0.5",
    # Зависимости для субагентов
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    # t-tech-investments ставим отдельно на уровне Dockerfile (uv pip install),
    # чтобы не ломать uv sync split-resolution (sys_platform == 'win32').
    "psutil>=6.1.0",
    "pytz>=2024.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Для подсчета токенов в анализаторе контекста
    "tiktoken>=0.5.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["giga_agent"]

# Конфигурация uv для использования CPU-only версии torch
# Это предотвратит загрузку CUDA зависимостей (nvidia-cuda-nvrtc-cu12, nvidia-cudnn-cu12 и т.д.)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Указываем, что torch должен браться из CPU-only индекса PyTorch
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
