server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

    client_max_body_size 150M;
    keepalive_timeout 75s;

    # Условная установка Connection только при апгрейде на WebSocket
    set $connection_upgrade "";
    if ($http_upgrade != "") {
        set $connection_upgrade "upgrade";
    }

    # ВАЖНО (Docker DNS):
    # Для динамического резолва сервисов внутри Docker используем resolver + proxy_pass через переменные.
    # Иначе Nginx может "залипнуть" на старом IP после пересоздания контейнеров.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream "http://giga_agent_server:8822";
    set $langgraph_upstream "http://langgraph-api:8000";

    # Redis API эндпоинты (с /api/ в пути) - должен быть первым для приоритета
    location /api/redis/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    # API эндпоинты для чатов (с /api/ в пути на бэкенде)
    location /api/chats/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    # API эндпоинт для информации о модели (с /api/ в пути на бэкенде)
    location /api/model-info {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    # API эндпоинт для OpenRouter (сброс кэша, модели и т.д.)
    location /api/openrouter/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization $http_authorization;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    # Прокси для tool_server (работает на порту 9091)
    # tool_server имеет эндпоинты вида /{tool_name}, поэтому проксируем /api/tool_server/{tool_name} -> tool_server:9091/{tool_name}
    location /api/tool_server/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $tool_server_upstream "http://tool_server:9091";
        rewrite ^/api/tool_server/(.*)$ /$1 break;
        proxy_pass         $tool_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization $http_authorization;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
        # Увеличенные таймауты для длительных операций
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Остальные API эндпоинты (без /api/ в пути на бэкенде)
    # Используем rewrite для удаления /api/ из пути
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    location ~ ^/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
        resolver 127.0.0.11 ipv6=off valid=60s;
        resolver_timeout 10s;

        set $upstream "$proto://$dst_host$dst_path$is_args$args";
        proxy_pass $upstream;

        # Правильные хедеры к апстриму
        proxy_set_header Host $dst_host;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Стриминг (SSE, большие ответы/загрузки)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # TLS SNI для https/wss
        proxy_ssl_server_name on;
        proxy_ssl_name $dst_host;
        proxy_ssl_session_reuse on;
    }

    location ~ ^/\.well-known/(?<auth>[^/]+)/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
        resolver 127.0.0.11 ipv6=off valid=60s;
        resolver_timeout 10s;

        set $upstream "$proto://$dst_host/.well-known/$auth$is_args$args";
        proxy_pass $upstream;

        # Правильные хедеры к апстриму
        proxy_set_header Host $dst_host;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Стриминг (SSE, большие ответы/загрузки)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # TLS SNI для https/wss
        proxy_ssl_server_name on;
        proxy_ssl_name $dst_host;
        proxy_ssl_session_reuse on;
    }

    location /files/files/ {
          alias /files/;
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    location /files/home/jupyter/ {
          alias /home/jupyter/;
          charset utf-8;
          charset_types text/plain text/csv application/json application/javascript text/css text/markdown text/x-markdown;
          
          # Определяем MIME-тип по расширению
          types {
              text/plain md txt csv log py;
              text/markdown markdown;
              text/html html htm;
              application/json json;
              application/javascript js;
              text/css css;
              text/xml xml;
              text/yaml yml yaml;
              image/png png;
              image/jpeg jpg jpeg;
              image/gif gif;
              image/svg+xml svg;
              application/pdf pdf;
              application/zip zip;
              application/x-tar tar;
              application/gzip gz;
          }
          default_type application/octet-stream;
          
          # Для текстовых файлов добавляем заголовок для скачивания
          if ($request_uri ~ \.(md|txt|csv|log|json|py|js|html|css|yml|yaml|xml)$) {
              add_header Content-Disposition 'attachment';
          }
          
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    location /files/runs/ {
          alias /runs/;
          charset utf-8;
          charset_types text/plain text/csv application/json application/javascript text/css text/markdown text/x-markdown;
          
          # Определяем MIME-тип по расширению
          types {
              text/plain md txt csv log;
              text/markdown markdown;
              text/html html htm;
              application/json json;
              application/javascript js;
              text/css css;
              image/png png;
              image/jpeg jpg jpeg;
              image/gif gif;
              image/svg+xml svg;
              application/pdf pdf;
              audio/mpeg mp3;
              audio/wav wav;
              video/mp4 mp4;
          }
          default_type application/octet-stream;
          
          # Для текстовых файлов отдаем как attachment для скачивания
          location ~ \.(md|txt|csv|log|json|py|js|html|css)$ {
              add_header Content-Disposition 'attachment';
              add_header Content-Type 'text/plain; charset=utf-8';
          }
          
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    # Прокси для загрузки файлов (эндпоинт /upload/)
    location /files/upload/ {
        proxy_pass         http://upload_server:9092/upload/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # ВАЖНО: Nginx преобразует заголовки с дефисами в подчеркивания
        # X-User-ID становится HTTP_X_USER_ID, но при proxy_set_header нужно использовать исходное имя
        proxy_set_header   X-User-ID $http_x_user_id;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-ID" always;
    }

    # Прокси для API работы с файлами знаний
    location /files/api/knowledge/ {
        proxy_pass         http://upload_server:9092/api/knowledge/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Прокси для STT сервиса (распознавание речи)
    # ПРИМЕЧАНИЕ: STT сервис теперь внешний (запускается из d:\Python\mcp\)
    # Используем переменную для динамического резолва, чтобы nginx не падал если сервис недоступен
    set $stt_upstream "http://host.docker.internal:9093";
    
    location /stt/ {
        rewrite ^/stt/(.*)$ /$1 break;
        proxy_pass         $stt_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_cache        off;
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        # Увеличенные таймауты для обработки аудио
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Обработка ошибок - возвращаем 503 если сервис недоступен
        proxy_intercept_errors on;
        error_page 502 503 504 = @stt_unavailable;
    }
    
    # Обработчик для недоступного STT сервиса
    location @stt_unavailable {
        default_type application/json;
        return 503 '{"error": "STT service unavailable", "message": "Speech-to-text service is not running. Start it from d:\\\\Python\\\\mcp\\\\"}';
    }

    # Прокси к upload серверу для скачивания файлов
    location /files/ {
        # ВАЖНО:
        # upload_server раздает скачивание файлов через эндпоинт /files/{filename}
        # (см. backend/repl/app/upload_server.py).
        # Поэтому проксируем /files/<name> -> upload_server:9092/files/<name>,
        # иначе получаем 404 и "Ошибка загрузки вложения" на фронте.
        proxy_pass         http://upload_server:9092/files/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-User-ID $http_x_user_id;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # Прокси к браузерному сервису HTTP API (для работы с куками)
    location /api/browser/ {
        rewrite ^/api/browser/(.*)$ /api/$1 break;
        proxy_pass         http://browser-service:7071;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Прокси к браузерному сервису (WebSocket для browser_task)
    location /browser/ {
        rewrite ^/browser/(.*)$ /$1 break;
        proxy_pass         http://browser-service:7070;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
        # Увеличенные таймауты для длительных операций браузера
        proxy_connect_timeout 60s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /graph/ {
        # ВАЖНО: proxy_pass с переменными иначе обрабатывает URI. Чтобы не терять путь,
        # делаем rewrite и proxy_pass БЕЗ части URI.
        rewrite ^/graph/(.*)$ /$1 break;
        proxy_pass         $langgraph_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    location /public/ {
        # alias указывает точный путь к каталогу, соответствующему URI после /public/
        alias /usr/share/nginx/html/;
        # если файл не найден — отдаём 404, иначе — файл
        try_files $uri =404;

        # можно добавить кэширование статики
        expires 30d;
        add_header Cache-Control "public";
    }

    # поддержка HTML5 History API для React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
