server {
    listen 0.0.0.0:80;
    server_name localhost;

    client_max_body_size 150M;
    keepalive_timeout 75s;

    # Условная установка Connection только при апгрейде на WebSocket
    set $connection_upgrade "";
    if ($http_upgrade != "") {
        set $connection_upgrade "upgrade";
    }

    # ВАЖНО (Docker DNS): динамический резолв сервисов внутри Docker
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream "http://giga_agent_server:8822";
    set $langgraph_upstream "http://langgraph-api:8000";

    # Прокси к backend API
    location /api/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    location /files/files/ {
          alias /files/;
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    location /files/home/jupyter/ {
          alias /home/jupyter/;
          charset utf-8;
          charset_types text/plain text/csv application/json application/javascript text/css text/html;
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    location /files/runs/ {
          alias /runs/;
          charset utf-8;
          charset_types text/plain text/csv application/json application/javascript text/css text/html;
          try_files $uri =404;
          autoindex off;
          expires 30d;
          add_header Cache-Control "public, max-age=2592000";
    }

    # Прокси для загрузки файлов (эндпоинт /upload/)
    location /files/upload/ {
        proxy_pass         http://upload_server:9092/upload/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-User-ID $http_x_user_id;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-ID" always;
    }

    # Прокси для API работы с файлами знаний
    location /files/api/knowledge/ {
        proxy_pass         http://upload_server:9092/api/knowledge/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Прокси к upload серверу для скачивания файлов
    location /files/ {
        proxy_pass         http://upload_server:9092/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    location ~ ^/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
        resolver 127.0.0.11 ipv6=off valid=60s;
        resolver_timeout 10s;

        set $upstream "$proto://$dst_host$dst_path$is_args$args";
        proxy_pass $upstream;

        # Правильные хедеры к апстриму
        proxy_set_header Host $dst_host;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Стриминг (SSE, большие ответы/загрузки)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # TLS SNI для https/wss
        proxy_ssl_server_name on;
        proxy_ssl_name $dst_host;
        proxy_ssl_session_reuse on;
    }

    location ~ ^/\.well-known/(?<auth>[^/]+)/proxy/(?<proto>https?|wss?):?/?/(?<dst_host>[^/]+)(?<dst_path>/.*)?$ {
        resolver 127.0.0.11 ipv6=off valid=60s;
        resolver_timeout 10s;

        set $upstream "$proto://$dst_host/.well-known/$auth$is_args$args";
        proxy_pass $upstream;

        # Правильные хедеры к апстриму
        proxy_set_header Host $dst_host;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Стриминг (SSE, большие ответы/загрузки)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # TLS SNI для https/wss
        proxy_ssl_server_name on;
        proxy_ssl_name $dst_host;
        proxy_ssl_session_reuse on;
    }

    # Прокси к браузерному сервису (WebSocket для browser_task)
    location /browser/ {
        rewrite ^/browser/(.*)$ /$1 break;
        proxy_pass         http://browser-service:7070;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
        # Увеличенные таймауты для длительных операций браузера
        proxy_connect_timeout 60s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Прокси к langgraph
    location /graph/ {
        # ВАЖНО: proxy_pass с переменными иначе обрабатывает URI. Чтобы не терять путь,
        # делаем rewrite и proxy_pass БЕЗ части URI.
        rewrite ^/graph/(.*)$ /$1 break;
        proxy_pass         $langgraph_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }

    location /nginx_status {
        # Turn on stats
        stub_status on;
        access_log   off;
        allow all;
   }

    # Всё остальное — на Vite dev сервер
    location / {
        proxy_pass         http://frontend-dev:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_cache_bypass      $http_upgrade;
    }
}


